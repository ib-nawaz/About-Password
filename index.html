    h-[7vh] w-[20vw] bg-fuchsia-500 rounded-3xl hover:scale-90">Generate Password</button>
    </div>




    <div class="flex flex-wrap bg-lime-300 min-h-[30vh] w-[50vw] mt-[25vh] rounded-4xl m-auto  items-center justify-center relative ">

        <input id="inpb" class="bg-orange-400  h-[7vh] w-[40vw] ml-5 mr-5 pl-5 rounded-2xl
     hover:rounded-4xl" type="password" placeholder="Show and Hide Password" value="">
